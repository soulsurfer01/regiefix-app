<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<title>Regiefix Lite</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --blau: #185FA5;
    --gelb: #F5A524;
    --dunkel: #13202E;
    --bg: #F3F6FA;
    --karte: #FFFFFF;
    --text: #13202E;
    --text2: #5A6B7D;
    --rand: #D5DEE8;
    --fehler: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1721;
      --karte: #13202E;
      --text: #EAF0F6;
      --text2: #9FB0C2;
      --rand: #27384A;
      --fehler: #FF8A80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
  }
  .kopf {
    background: var(--blau);
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo svg { width: 24px; height: 24px; }
  .titel { color: #fff; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .unter { color: #B5D4F4; font-size: 13px; }
  .lite {
    margin-left: auto;
    background: var(--gelb);
    color: var(--dunkel);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .karte {
    background: var(--karte);
    border: 1px solid var(--rand);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .zeile { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--rand);
    border-radius: 10px;
    padding: 10px 12px;
  }
  textarea { resize: vertical; min-height: 96px; }
  input:focus, textarea:focus {
    outline: 2px solid var(--blau);
    outline-offset: 1px;
  }
  button {
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--blau);
    border: none;
    border-radius: 12px;
    height: 48px;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .fehler { color: var(--fehler); font-size: 13px; min-height: 18px; }
  .fuss { text-align: center; font-size: 12px; color: var(--text2); margin-top: 12px; }
</style>
</head>
<body>

<div class="kopf">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>
  </div>
  <div>
    <div class="titel">Regiefix</div>
    <div class="unter">Rapport als PDF</div>
  </div>
  <div class="lite">Lite</div>
</div>

<main>
  <div class="karte">
    <div>
      <label for="baustelle">Baustelle</label>
      <input id="baustelle" type="text" placeholder="Neubau Musterstraße 5" autocomplete="off">
    </div>
    <div class="zeile">
      <div>
        <label for="ort">Ort</label>
        <input id="ort" type="text" placeholder="Hamburg" autocomplete="off">
      </div>
      <div>
        <label for="datum">Datum</label>
        <input id="datum" type="text" autocomplete="off">
      </div>
    </div>
    <div>
      <label for="arbeiten">Ausgeführte Arbeiten</label>
      <textarea id="arbeiten" placeholder="Was wurde heute gemacht?"></textarea>
    </div>
    <div class="zeile">
      <div>
        <label for="mitarbeiter">Mitarbeiter</label>
        <input id="mitarbeiter" type="text" placeholder="Name" autocomplete="off">
      </div>
      <div>
        <label for="stunden">Stunden</label>
        <input id="stunden" type="text" inputmode="decimal" placeholder="8" autocomplete="off">
      </div>
    </div>
    <div class="fehler" id="fehler"></div>
    <button id="knopf" type="button">PDF erstellen</button>
  </div>
  <div class="fuss">Lite-Version · erstellt mit Regiefix</div>
</main>

<script>
  var datumFeld = document.getElementById('datum');
  var heute = new Date();
  datumFeld.value =
    ('0' + heute.getDate()).slice(-2) + '.' +
    ('0' + (heute.getMonth() + 1)).slice(-2) + '.' +
    heute.getFullYear();

  var fehlerFeld = document.getElementById('fehler');
  document.getElementById('baustelle').addEventListener('input', function () {
    fehlerFeld.textContent = '';
  });

  function wert(id) {
    return document.getElementById(id).value.trim();
  }

  function dateiname(baustelle, datum) {
    var rein = (baustelle + '-' + datum)
      .replace(/[^a-zA-Z0-9äöüÄÖÜß.\-]+/g, '-')
      .replace(/-+/g, '-');
    return 'Rapport-' + rein + '.pdf';
  }

  document.getElementById('knopf').addEventListener('click', function () {
    var baustelle = wert('baustelle');
    if (!baustelle) {
      fehlerFeld.textContent = 'Trag eine Baustelle ein.';
      document.getElementById('baustelle').focus();
      return;
    }
    if (!window.jspdf) {
      fehlerFeld.textContent = 'Die PDF-Bibliothek ist nicht geladen. Prüf deine Verbindung und lad die Seite neu.';
      return;
    }

    var ort = wert('ort');
    var datum = wert('datum');
    var arbeiten = wert('arbeiten');
    var mitarbeiter = wert('mitarbeiter');
    var stunden = wert('stunden');

    var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    var breite = 210;
    var rand = 18;

    doc.setFillColor(24, 95, 165);
    doc.rect(0, 0, breite, 28, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('Rapport', rand, 18);

    doc.setTextColor(19, 32, 46);
    var y = 42;

    function feld(titel, text) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(90, 107, 125);
      doc.text(titel, rand, y);
      y += 5.5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      doc.setTextColor(19, 32, 46);
      var zeilen = doc.splitTextToSize(text || '–', breite - 2 * rand);
      doc.text(zeilen, rand, y);
      y += zeilen.length * 5.8 + 7;
    }

    feld('BAUSTELLE', baustelle);
    feld('ORT', ort);
    feld('DATUM', datum);
    feld('AUSGEFÜHRTE ARBEITEN', arbeiten);
    feld('MITARBEITER', mitarbeiter);
    feld('STUNDEN', stunden);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(120, 134, 150);
    doc.text('Erstellt mit Regiefix Lite', rand, 288);

    var name = dateiname(baustelle, datum);
    var blob = doc.output('blob');
    var datei = new File([blob], name, { type: 'application/pdf' });

    if (navigator.canShare && navigator.canShare({ files: [datei] })) {
      navigator.share({ files: [datei], title: name }).catch(function () {});
    } else {
      doc.save(name);
    }
  });
</script>
</body>
</html>
